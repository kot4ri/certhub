<style>
.certhub{height:100vh;min-height:0;color:#333;box-sizing:border-box;display:flex;overflow:hidden;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.certhub .tabs{display:flex;flex:0 0 210px;flex-direction:column;gap:4px;padding:22px 14px;box-sizing:border-box;border-right:1px solid #e5e5e5;background:#f7f9fa;overflow-y:auto}.certhub .tabs:before{content:"CertHub";display:block;padding:0 12px 18px;color:#1f2937;font-size:21px;font-weight:600;letter-spacing:.2px}.certhub .tabs button{width:100%;border:0;border-radius:4px;background:transparent;padding:11px 13px;cursor:pointer;white-space:nowrap;text-align:left;color:#4b5563}.certhub .tabs button:hover{background:#edf1f2}.certhub .tabs button.active,.certhub .btn{background:#20a53a;color:#fff}.certhub .actions{display:flex;gap:8px;margin-bottom:12px}.certhub .btn{border:0;border-radius:3px;padding:8px 13px;cursor:pointer}.certhub .danger{background:#d9534f}.certhub .panel{border:1px solid #ddd;padding:15px;margin-bottom:14px}.certhub .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.certhub .card{border:1px solid #ddd;padding:18px}.certhub .number{font-size:28px;color:#20a53a}#certhub-content{flex:1 1 auto;min-width:0;min-height:0;overflow:auto;padding:24px;box-sizing:border-box}.certhub table{width:100%;min-width:760px;border-collapse:collapse}.certhub th,.certhub td{padding:8px;border:1px solid #e5e5e5;text-align:left;vertical-align:top}.certhub th{background:#f7f7f7;position:sticky;top:0;z-index:1}.certhub .muted{color:#888}.certhub .bad{color:#d9534f}.certhub .good{color:#20a53a}.certhub input,.certhub select{border:1px solid #ccc;padding:7px;box-sizing:border-box}.certhub .install-toolbar{display:flex;align-items:center;justify-content:space-between;margin-top:14px}.certhub .install{margin:8px 0 0;white-space:pre-wrap;word-break:break-all;background:#20252b;color:#e5e5e5;padding:14px;border-radius:3px}.certhub .install-note{margin:8px 0 0;color:#d48806}.certhub .launch-panel{margin:auto;max-width:460px;padding:30px;text-align:center}.certhub .launch-panel .btn{display:inline-block;margin-top:12px;text-decoration:none}@media(max-width:900px){.certhub .tabs{flex-basis:176px;padding:16px 10px}.certhub .cards{grid-template-columns:repeat(2,minmax(0,1fr))}#certhub-content{padding:16px}}@media(max-width:640px){.certhub{flex-direction:column}.certhub .tabs{flex:0 0 auto;flex-direction:row;padding:8px;overflow-x:auto;border-right:0;border-bottom:1px solid #e5e5e5}.certhub .tabs:before{display:none}.certhub .tabs button{width:auto}.certhub .cards{grid-template-columns:1fr}}
/* Client management dialogs */
.certhub .modal-mask{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(15,23,42,.42)}
.certhub .modal-box{width:min(620px,100%);max-height:calc(100vh - 40px);overflow:auto;border-radius:6px;background:#fff;box-shadow:0 18px 55px rgba(0,0,0,.22)}
.certhub .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #e5e5e5}.certhub .modal-head h3{margin:0;font-size:17px}.certhub .modal-close{border:0;background:transparent;color:#777;font-size:25px;line-height:1;cursor:pointer}
.certhub .modal-body{padding:20px}.certhub .form-row{margin-bottom:15px}.certhub .form-row>label{display:block;margin-bottom:7px;font-weight:600}.certhub .form-row input[type=text],.certhub .form-row select{width:100%}.certhub .check-list{display:flex;flex-wrap:wrap;gap:10px 16px}.certhub .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.certhub .page-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.certhub .page-toolbar h2{margin:0;font-size:20px}
</style>
<div class="certhub"><div class="tabs"><button data-tab="dashboard" class="active">概览</button><button data-tab="local">本地证书</button><button data-tab="certificates">已管理证书</button><button data-tab="clients">客户端与权限</button><button data-tab="events">拉取记录</button><button data-tab="settings">设置</button></div><div id="certhub-content">正在加载...</div></div>
<script>
(function(){const root=document.getElementById('certhub-content');const standalone=location.pathname==='/certhub-api'&&new URLSearchParams(location.search).get('action')==='admin_ui';if(!standalone){const page=window.open('/certhub-api?action=admin_ui','certhub-admin');if(page){setTimeout(()=>{const app=root.closest('.certhub');const layerBox=app&&app.closest('.layui-layer');const close=layerBox&&layerBox.querySelector('.layui-layer-close');const dialog=app&&app.closest('.el-dialog');const dialogClose=dialog&&dialog.querySelector('.el-dialog__headerbtn');if(close)close.click();else if(dialogClose)dialogClose.click()},80)}else{root.innerHTML='<div class="launch-panel"><h3>CertHub 管理中心</h3><p>浏览器阻止了新标签页，请点击下方按钮继续。</p><a class="btn" href="/certhub-api?action=admin_ui" target="_blank">在新标签页打开</a></div>'}return}document.title='CertHub 管理中心';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const api=(method,data)=>fetch('/certhub-api?action=admin_call&method='+encodeURIComponent(method),{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:new URLSearchParams(data||{}).toString()}).then(r=>{if(r.status===401||r.status===403)throw new Error('登录已失效，请重新登录宝塔面板');return r.json()}).then(r=>{if(!r||!r.status)throw new Error((r&&r.msg)||'请求失败');return r.data});const error=e=>root.innerHTML='<p class="bad">'+esc(e.message||e)+'</p>';
async function dashboard(){try{const d=await api('dashboard');root.innerHTML='<div class="cards"><div class="card"><div class="number">'+d.certificates+'</div>已管理证书</div><div class="card"><div class="number">'+d.clients+'</div>有效客户端</div><div class="card"><div class="number">'+d.online_24h+'</div>24小时在线</div><div class="card"><div class="number">'+d.pulls_24h+'</div>24小时拉取</div></div><div class="panel" style="margin-top:15px"><b>客户端 API：</b> '+esc((d.panel_base_url||'尚未设置')+d.api_path)+'<br><span class="muted">认证数据库：'+esc(d.database_path)+'；证书始终从宝塔原目录实时读取，不复制入库。</span></div>'}catch(e){error(e)}}
async function local(){try{const rows=await api('discover_local');root.innerHTML='<div class="actions"><button class="btn" id="refresh">重新扫描</button></div><table><tr><th>名称</th><th>路径</th><th>域名</th><th>到期</th><th>状态</th><th>操作</th></tr>'+rows.map((r,i)=>'<tr><td>'+esc(r.name)+'</td><td>'+esc(r.path)+'</td><td>'+esc((r.sans||[]).join(', '))+'</td><td>'+esc(r.not_after||'-')+'</td><td class="'+(r.error?'bad':'good')+'">'+esc(r.error||'有效')+'</td><td>'+(r.managed?'已纳管':'<button class="btn manage" data-i="'+i+'">纳管</button>')+'</td></tr>').join('')+'</table>';document.getElementById('refresh').onclick=local;root.querySelectorAll('.manage').forEach(b=>b.onclick=()=>api('import_local',{path:rows[b.dataset.i].path,name:rows[b.dataset.i].name}).then(local).catch(error))}catch(e){error(e)}}
async function certificates(){try{const rows=await api('certificates');root.innerHTML='<div class="actions"><button class="btn" id="checkAll">检查全部</button></div><table><tr><th>名称</th><th>主题/SAN</th><th>实时来源</th><th>到期</th><th>状态</th><th>操作</th></tr>'+rows.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+esc(r.subject_name)+'<br><span class="muted">'+esc((r.sans||[]).join(', '))+'</span></td><td>'+esc(r.source_path)+'</td><td>'+esc(r.not_after||'-')+'</td><td class="'+(r.last_error?'bad':'good')+'">'+esc(r.last_error||'正常')+'</td><td><button class="btn danger remove-cert" data-id="'+r.id+'">取消纳管</button></td></tr>').join('')+'</table>';document.getElementById('checkAll').onclick=()=>api('sync_now').then(certificates).catch(error);root.querySelectorAll('.remove-cert').forEach(b=>b.onclick=()=>confirm('仅取消纳管，不会删除源证书。继续？')&&api('remove_certificate',{id:b.dataset.id}).then(certificates).catch(error))}catch(e){error(e)}}
async function clients(){try{const [rows,certs]=await Promise.all([api('clients'),api('certificates')]);const copyText=text=>navigator.clipboard&&window.isSecureContext?navigator.clipboard.writeText(text):new Promise((resolve,reject)=>{const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();try{document.execCommand('copy')?resolve():reject(new Error('复制失败'))}catch(e){reject(e)}finally{area.remove()}});const openModal=(title,content)=>{const mask=document.createElement('div');mask.className='modal-mask';mask.innerHTML='<div class="modal-box"><div class="modal-head"><h3>'+esc(title)+'</h3><button class="modal-close" aria-label="关闭">&times;</button></div><div class="modal-body">'+content+'</div></div>';root.appendChild(mask);const close=()=>mask.remove();mask.querySelector('.modal-close').onclick=close;mask.onclick=e=>{if(e.target===mask)close()};return mask};const showCommand=(box,d)=>{box.innerHTML='<div class="install-toolbar"><b>安装命令</b><button class="btn copy-install">复制命令</button></div><pre class="install">'+esc(d.install_command)+'</pre><p class="install-note">该安装信息只能使用一次，并将在 30 分钟后失效。</p>';box.querySelector('.copy-install').onclick=e=>copyText(d.install_command).then(()=>{e.currentTarget.textContent='已复制';setTimeout(()=>e.currentTarget.textContent='复制命令',1600)}).catch(()=>alert('复制失败，请手动选择命令'))};root.innerHTML='<div class="page-toolbar"><h2>客户端管理</h2><button class="btn" id="addClient">新增客户端</button></div><table><tr><th>客户端</th><th>系统信息</th><th>最后 IP/时间</th><th>状态</th><th>操作</th></tr>'+rows.map(r=>'<tr><td>'+esc(r.name)+'<br><span class="muted">'+esc(r.client_uuid)+'</span></td><td>'+esc(r.hostname||'-')+'<br>'+esc(r.os_name||'-')+' '+esc(r.os_version||'')+'<br>'+esc(r.architecture||'')+' / Agent '+esc(r.agent_version||'-')+'</td><td>'+esc(r.last_ip||'-')+'<br>'+esc(r.last_seen_at||'-')+'</td><td>'+esc(r.status)+'</td><td>'+(r.status==='pending'?'<button class="btn reissue" data-id="'+r.id+'">安装命令</button> ':'')+(r.status!=='revoked'?'<button class="btn grant" data-id="'+r.id+'">编辑权限范围</button> <button class="btn danger revoke" data-id="'+r.id+'">撤销权限</button> ':'')+'<button class="btn danger delete-client" data-id="'+r.id+'">删除</button></td></tr>').join('')+'</table>';document.getElementById('addClient').onclick=()=>{const modal=openModal('新增客户端','<div class="form-row"><label>客户端名称</label><input type="text" id="clientName" placeholder="例如：生产服务器"></div><div class="form-row"><label>平台</label><select id="clientPlatform"><option value="linux">Linux</option><option value="windows">Windows</option></select></div><div class="form-row"><label>允许使用的证书</label><div class="check-list">'+certs.map(c=>'<label><input type="checkbox" class="clientCert" value="'+c.id+'"> '+esc(c.name)+'</label>').join('')+'</div></div><div class="modal-actions"><button class="btn" id="createClient">创建并生成安装命令</button></div><div id="installResult"></div>');modal.querySelector('#createClient').onclick=e=>{e.currentTarget.disabled=true;api('create_client',{name:modal.querySelector('#clientName').value,platform:modal.querySelector('#clientPlatform').value,certificate_ids:JSON.stringify([...modal.querySelectorAll('.clientCert:checked')].map(x=>Number(x.value)))}).then(d=>showCommand(modal.querySelector('#installResult'),d)).catch(err=>{e.currentTarget.disabled=false;alert(err.message||err)})}};root.querySelectorAll('.reissue').forEach(b=>b.onclick=()=>{const modal=openModal('安装命令','<div id="installResult">正在生成...</div>');api('reissue_enrollment',{id:b.dataset.id}).then(d=>showCommand(modal.querySelector('#installResult'),d)).catch(err=>modal.querySelector('#installResult').innerHTML='<p class="bad">'+esc(err.message||err)+'</p>')});root.querySelectorAll('.grant').forEach(b=>b.onclick=async()=>{const grants=await api('grants',{client_id:b.dataset.id});const modal=openModal('编辑权限范围','<div class="form-row"><label>证书</label><select id="grantCert">'+certs.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select></div><div class="form-row"><label>权限</label><select id="grantEffect"><option value="allow">允许</option><option value="deny">拒绝</option></select></div><div class="form-row"><label>部署方式</label><select id="grantProfile"><option value="files-only">仅保存版本</option><option value="bt-nginx">宝塔 Nginx</option><option value="nginx">系统 Nginx</option><option value="apache">Apache</option></select></div><div class="form-row"><label>证书目标路径</label><input type="text" id="targetCert" placeholder="fullchain.pem 目标绝对路径"></div><div class="form-row"><label>私钥目标路径</label><input type="text" id="targetKey" placeholder="privkey.pem 目标绝对路径"></div><div class="modal-actions"><button class="btn" id="saveGrant">保存权限</button></div>');const fill=()=>{const g=grants.find(x=>String(x.certificate_id)===modal.querySelector('#grantCert').value)||{};modal.querySelector('#grantEffect').value=g.effect||'deny';modal.querySelector('#grantProfile').value=g.install_profile||'files-only';modal.querySelector('#targetCert').value=g.target_fullchain||'';modal.querySelector('#targetKey').value=g.target_private_key||''};modal.querySelector('#grantCert').onchange=fill;fill();modal.querySelector('#saveGrant').onclick=()=>api('save_grant',{client_id:b.dataset.id,certificate_id:modal.querySelector('#grantCert').value,effect:modal.querySelector('#grantEffect').value,install_profile:modal.querySelector('#grantProfile').value,target_fullchain:modal.querySelector('#targetCert').value,target_private_key:modal.querySelector('#targetKey').value}).then(()=>{alert('权限已保存');modal.remove()}).catch(err=>alert(err.message||err))});root.querySelectorAll('.revoke').forEach(b=>b.onclick=()=>confirm('确定撤销该客户端的全部访问权限？')&&api('revoke_client',{id:b.dataset.id}).then(clients).catch(error));root.querySelectorAll('.delete-client').forEach(b=>b.onclick=()=>confirm('确定彻底删除该客户端及其注册凭据、证书授权和拉取记录？此操作不可恢复。')&&api('delete_client',{id:b.dataset.id}).then(clients).catch(error))}catch(e){error(e)}}
async function events(){try{const rows=await api('pull_events');root.innerHTML='<table><tr><th>时间</th><th>客户端</th><th>动作/证书</th><th>来源 IP</th><th>客户端系统</th></tr>'+rows.map(r=>'<tr><td>'+esc(r.created_at)+'</td><td>'+esc(r.client_name)+'</td><td>'+esc(r.action)+' / '+esc(r.certificate_name||'-')+'</td><td>'+esc(r.ip_address||'-')+'</td><td>'+esc(r.hostname||'-')+'<br>'+esc(r.os_name||'-')+' '+esc(r.os_version||'')+' '+esc(r.architecture||'')+'</td></tr>').join('')+'</table>'}catch(e){error(e)}}
async function settings(){try{const d=await api('dashboard');root.innerHTML='<div class="panel"><h4>宝塔面板公开地址</h4><input id="panelUrl" style="width:520px" value="'+esc(d.panel_base_url||location.origin)+'" placeholder="https://panel.example.com:端口"> <button class="btn" id="save">保存</button><p class="muted">客户端 API 固定注册为该地址下的 /certhub-api。地址必须使用受客户端信任的 HTTPS 证书；宝塔的域名和 IP 白名单仍然生效。</p></div>';document.getElementById('save').onclick=()=>api('save_settings',{panel_base_url:document.getElementById('panelUrl').value}).then(settings).catch(error)}catch(e){error(e)}}
const pages={dashboard,local,certificates,clients,events,settings};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');pages[b.dataset.tab]()});dashboard()})();
</script>
